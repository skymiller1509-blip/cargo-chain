[package]
name = "cargo-chain"
version = "0.1.0"
edition = "2021"
description = "CargoChain Provenance Ledger - a shipment provenance contract for MetaEarth (ME Network). Register a shipment, record on-chain checkpoints at each port/handler, verify the full trail."
license = "MIT"
repository = "https://github.com/skymiller1509-blip/cargo-chain"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cosmwasm-std = "1.5.0"
cosmwasm-schema = "1.5.0"
cw-storage-plus = "1.2.0"
cw2 = "1.0.0"
schemars = "0.8"
serde = { version = "1.0", default-features = false, features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
cw-multi-test = "0.20.0"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
